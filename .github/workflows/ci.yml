name: CI

on:
  push:
    paths-ignore:
      - 'bench/**'
      - '*.md'
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
    paths-ignore:
      - 'bench/**'
      - '*.md'
    branches:
      - main

jobs:
  test:
    name: Bun
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v2

    - name: Install
      run: bun install

    - name: Check
      run: bun run check

    - name: Test
      run: bun run test

    - name: Build
      run: bun run build
