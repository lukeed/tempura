name: CI

on:
  push:
    paths-ignore:
      - 'bench/**'
      - '*.md'
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    paths-ignore:
      - 'bench/**'
      - '*.md'
    branches:
      - main

jobs:
  test:
    name: Bun
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    - name: Install
      run: bun install

    - name: Check
      run: bun run check

    - name: Test
      run: bun run test

    - name: Build
      run: bun run build

  # https://docs.npmjs.com/trusted-publishers
  publish:
    name: publish to npm
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # -> npm trusted publishing, with provenance
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'

    - name: Install
      run: bun install

    - name: Build
      run: bun run build

    - name: Check version
      run: |
        version=$(jq -r .version package.json)
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::package.json is v$version, but the tag is $GITHUB_REF_NAME"
          exit 1
        fi

    - name: 'Publish → npm'
      run: |
        tag=latest
        if [[ "$GITHUB_REF_NAME" == *-next.* ]]; then tag=next; fi
        npm publish --provenance --access public --tag $tag
